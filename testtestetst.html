<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			.listening {
				display: flex;
				width: 176px;
				height: 80px;
				font-size: 12px;
				gap: 7px;
				align-items: center;
				text-align: left;
			}

			.entry-sidebar {
				float: left;
				margin-right: 50px;
				display: flex;
				flex-direction: column;
				padding: 15px;
			}
			.entries {
				float: left;
				overflow-x: scroll;
			}
			article p {
				max-width: 60ch;
			}
			.entries article:target {
				display: block;
			}
			.entries article {
				display: none;
			}
			.outlined {
				border: solid;
			}
		</style>
	</head>
	<body>
		<div class="listening" id="listening"></div>
		<script>
			const USERNAME = "madieracitrine"; // Put your LastFM username here
			const BASE_URL = `https://lastfm-last-played.biancarosa.com.br/${USERNAME}/latest-song`;

			const getTrack = async () => {
				const request = await fetch(BASE_URL);
				const json = await request.json();
				let status;

				let isPlaying = json.track["@attr"]?.nowplaying || false;

				// Values:
				// COVER IMAGE: json.track.image[1]['#text']
				// TITLE: json.track.name
				// ARTIST: json.track.artist['#text']

				document.getElementById("listening").innerHTML = `
    <img src="${json.track.image[1]["#text"]}" style="height: 58px; image-rendering: pixelated;">
    <div id="trackInfo">
    <marquee id="trackName" scrollamount="3.9">${json.track.name}</marquee>
    <p id="artistName" style="color: black; margin-top: 8px">${json.track.artist["#text"]}</p>
    </div>
    `;
			};

			getTrack();
			setInterval(() => {
				getTrack();
			}, 10000);
		</script>

		<div class="entry-sidebar">
			<a href="#test">
				<!--Link coincides with article id -->
				1</a
			>
			<!--Put the name of the entry here-->
			<a href="#test2">2</a>
			<a href="#test3">3</a>
			<a href="#test4">4</a>
		</div>

		<div class="entries">
			<article id="test">
				<h3>Article Name</h3>
				<p>Article Text</p>
			</article>
			<article id="test2">
				<h3>Article Name</h3>
				<p>Article Text</p>
			</article>
			<article id="test3">
				<h3>Article Name</h3>
				<p>Article Text</p>
			</article>
			<article id="test4">
				<h3>Article Name</h3>
				<p>Article Text</p>
			</article>
		</div>

		<marquee
			direction="down"
			width="250"
			height="200"
			behavior="alternate"
			class="outlined"
		>
			<marquee behavior="alternate">DVD</marquee>
		</marquee>
	</body>
</html>
